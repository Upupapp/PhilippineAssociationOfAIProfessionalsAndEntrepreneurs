<!doctype html><html lang="en" data-page="admin-events"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Events — PAAIPE Admin</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/paaipe-admin.css"></head><body data-admin-events>
<div class="ashell">

  <aside class="aside">
    <a class="logo" href="admin.html"><img src="assets/img/paaipe-logo.png" alt="PAAIPE"><span>ADMIN</span></a>
    <ul class="amenu" data-admin-nav></ul>
  </aside>

  <div class="amain">
    <header class="top" data-admin-top></header>

    <div class="wrap">
      <nav class="crumbs" data-crumbs></nav>
      <div class="statechip" data-state-chip hidden></div>
      <div class="flash" data-flash hidden></div>

      <section class="card" data-event-list>
        <div class="hd"><h2>All events</h2><span class="count" data-event-count>…</span></div>
        <div class="tbl"><table>
          <thead><tr><th>Event</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody data-events><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
        </table></div>
        <p class="note">Drafts are listed here and nowhere else — the security rules refuse to serve
          one to the public, so an unpublished event cannot leak even if somebody has the link.</p>
      </section>

      <div class="cols" data-editor-cols hidden>
        <div class="colmain">
          <!-- One event, one workspace. Sponsors, applications and registrations
               for THIS event are edited here, not on a cross-event page that
               happens to be filtered. The cross-event pages still exist for the
               questions that span events. -->
          <nav class="etabs" data-event-tabs role="tablist"></nav>

          <div data-tabpanel="details" data-event-editor></div>
          <div data-tabpanel="media" hidden></div>
          <div data-tabpanel="sponsors" hidden></div>
          <div data-tabpanel="applications" hidden></div>
          <div data-tabpanel="registrations" hidden></div>
          <div data-tabpanel="settings" hidden></div>
        </div>
        <div class="colside" data-publish-rail></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="assets/js/paaipe-admin-events.js"></script>
</body></html>
