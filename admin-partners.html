<!doctype html><html lang="en" data-page="admin-partners"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Partner applications — PAAIPE Admin</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/paaipe-admin.css"></head><body data-admin-partners>
<div class="ashell">

  <aside class="aside" id="admin-aside">
    <a class="logo" href="admin.html"><img src="assets/img/paaipe-logo.png" alt="PAAIPE"><span>ADMIN</span></a>
    <ul class="amenu" data-admin-nav></ul>
  </aside>

  <div class="amain">
    <header class="top" data-admin-top>
      <button type="button" class="aburger" data-admin-burger aria-label="Menu" aria-expanded="false" aria-controls="admin-aside"><span></span></button>
    </header>

    <div class="wrap">
      <div class="flash" data-flash hidden></div>

      <section class="card">
        <div class="inbox-bar">
          <div class="filters">
            <select data-f-event aria-label="Filter by event"></select>
            <select data-f-status aria-label="Filter by status">
              <option value="">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="in_discussion">In discussion</option>
              <option value="accepted">Accepted</option>
              <option value="declined">Declined</option>
              <option value="spam">Spam</option>
            </select>
            <select data-f-source aria-label="Filter by where it came from">
              <option value="">Everywhere</option>
              <option value="public_event">Public event page</option>
              <option value="events_list">Events list</option>
              <option value="success_page">Registration success page</option>
              <option value="portal_sessions">Portal · Sessions</option>
              <option value="portal_events">Portal · Events</option>
              <option value="portal_session">Portal · Session detail</option>
            </select>
            <input type="search" data-f-q placeholder="Search company or email" aria-label="Search applications">
            <span class="grow"></span>
            <button class="btn btn-ghost btn-sm" data-export>Export CSV</button>
          </div>
          <div class="tally-line">
            <div class="tally" data-tally></div>
            <span class="count" data-count>…</span>
          </div>
        </div>

        <div class="tbl"><table>
          <thead><tr><th>Reference</th><th>Company</th><th>Contact</th><th>Offering</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
          <tbody data-rows><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
        </table></div>

        <div class="detail" data-detail hidden></div>

        <p class="note">Applications stay private until you Accept, then confirm them on Organizations.</p>
      </section>
    </div>
  </div>
</div>
<script type="module" src="assets/js/paaipe-admin-partners.js"></script>
</body></html>
