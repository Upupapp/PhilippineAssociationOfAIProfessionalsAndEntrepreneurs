<!doctype html><html lang="en" data-page="admin-signin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrator sign in — PAAIPE</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
  :root{--navy:#002166;--royal:#065092;--gold:#F2A71B;--lgold:#F6DB74;--pale:#EAF3FC;--ink:#0f1e3d;--muted:#8fa6c9;--line:rgba(255,255,255,.16);--err:#ff6b5e;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;font-family:Poppins,system-ui,sans-serif;background:linear-gradient(170deg,#021341,#052b63 60%,#03204e);color:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:32px 20px}
  a{color:#9fd0f7}
  .card{width:100%;max-width:400px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.16);border-radius:var(--radius);padding:30px 28px;backdrop-filter:blur(6px);box-shadow:0 24px 60px rgba(0,10,40,.42)}
  .logomark{display:block;width:max-content;margin:0 auto 20px;background:#fff;border-radius:12px;padding:9px 14px}
  .logomark img{display:block;height:30px}
  .kicker{display:flex;align-items:center;justify-content:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--lgold);text-transform:uppercase;margin-bottom:8px}
  .kicker span{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  h1{margin:0 0 4px;font-size:21px;line-height:1.25;text-align:center;letter-spacing:-.01em}
  .sub{margin:0 0 22px;font-size:13.5px;color:var(--muted);text-align:center}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 6px;color:#cfe2f8}
  .f{margin-bottom:14px}
  input{width:100%;padding:11px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.22);background:rgba(2,14,44,.55);color:#fff;font:inherit;font-size:14px}
  input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  .btn{width:100%;padding:12px 18px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--lgold),var(--gold));color:var(--navy);transition:transform .15s,filter .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.65;cursor:progress;transform:none}
  .btn[data-busy]::after{content:" …"}
  .row{display:flex;justify-content:flex-end;margin:-4px 0 18px}
  .row a{font-size:12.5px;color:#9fd0f7;text-decoration:none}.row a:hover{text-decoration:underline}
  .err{background:rgba(255,107,94,.13);border:1px solid rgba(255,107,94,.45);color:#ffd2cd;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:16px}
  .note{background:rgba(159,208,247,.12);border:1px solid rgba(159,208,247,.35);color:#d8ecfc;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:16px}
  .foot{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:var(--muted);text-align:center}
  .foot a{color:#9fd0f7;text-decoration:none;font-weight:600}.foot a:hover{text-decoration:underline}
  [hidden]{display:none!important}
</style></head><body>
<main class="card">
  <a class="logomark" href="index.html" aria-label="PAAIPE home"><img src="assets/img/paaipe-logo.png" alt="PAAIPE"></a>
  <div class="kicker"><span></span>Staff access</div>
  <h1>Administrator sign in</h1>
  <p class="sub">This entrance is for PAAIPE administrators.</p>

  <div class="err" data-admin-error hidden></div>
  <div class="note" data-admin-note hidden></div>

  <form data-admin-signin novalidate>
    <div class="f"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required></div>
    <div class="f"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div class="row"><a href="#" data-admin-forgot>Forgot password</a></div>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <p class="foot">Not an administrator? <a href="signin.html">Sign in as a member</a></p>
</main>
<script type="module" src="assets/js/paaipe-admin.js"></script>
</body></html>
